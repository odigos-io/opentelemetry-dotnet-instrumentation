name: Vulnerability Checker

on:
  pull_request:
  workflow_dispatch:
    # Allow choosing the severity cutoff level when manually triggering the workflow
    inputs:
      severity-cutoff:
        description: "Severity cutoff level for vulnerability scanning (e.g., low, medium, high, critical)"
        required: false
        default: "critical"
      only-fixed:
        description: "Report only fixed vulnerabilities"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  scan-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create image tag
        run: echo "IMAGE_TAG=otel-dotnet:${{ github.sha }}" >> $GITHUB_ENV

      - name: Overwrite patched files
        run: cp -r ./patched/* ./source/

      - name: build container
        uses: docker/build-push-action@v4
        with:
          context: ./source/docker
          file: ./source/docker/debian.dockerfile
          tags: ${{ env.IMAGE_TAG }}
          push: false
          load: true

      - name: Build native library (smoke test)
        run: |
          cd source
          docker run --platform=linux/amd64 -e OS_TYPE=linux-glibc --rm \
            -v "$(pwd)":/project \
            ${{ env.IMAGE_TAG }} \
            ./build.sh buildNativeWorkflow

      - name: Scan binary (Grype)
        uses: anchore/scan-action@v6
        with:
          path: ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/
          output-format: table
          fail-build: true
          severity-cutoff: ${{ github.event.inputs.severity-cutoff || 'critical' }}
          only-fixed: ${{ github.event.inputs.only-fixed || 'true' }}
