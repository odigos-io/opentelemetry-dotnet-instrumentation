name: Build and test

on:
  pull_request:

permissions:
  contents: read
env:
  LEGACY_TAG: v0.4.0-beta.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-with-glibc:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-32
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-32
    runs-on: ${{ matrix.architecture.runner }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Checkout source code at version specified in version.txt
        id: get_version
        run: |
          cd source
          git fetch --tags
          # Checkout latest tag; read it from the version.txt file 
          VERSION=$(cat ../version.txt)
          echo "Checking out version: $VERSION"
          git checkout $VERSION
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.architecture.alias }}
        uses: docker/build-push-action@v6
        with:
          context: ./patched/docker
          file: ./patched/docker/glibc.dockerfile
          platforms: linux/${{ matrix.architecture.name }}
          push: false
          load: true
          tags: dev/dotnet-builder:${{ matrix.architecture.alias }}

      - name: Build and test for ${{ matrix.architecture.alias }}
        run: |
          cd source
          docker run --platform=linux/${{ matrix.architecture.name }} -e OS_TYPE=linux-glibc --rm \
            -v "$(pwd)":/project \
            -w /project \
            dev/dotnet-builder:${{ matrix.architecture.alias }} \
            ./build.sh

      - name: Verify built artifact exists
        run: |
          test -f ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so

      # Upload the .so file
      - name: Upload native .so
        uses: actions/upload-artifact@v4
        with:
          name: OpenTelemetry.AutoInstrumentation.Native-${{ steps.get_version.outputs.version }}-${{ matrix.architecture.alias }}.so
          path: ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so

  # Need to build musl
  build-legacy-dotnet6-with-musl:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-32
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-32
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Checkout tag ${{ env.LEGACY_TAG }}
        run: |
          cd source
          git fetch --tags
          git checkout "${{ env.LEGACY_TAG }}"

      - name: Overwrite patched files
        run: cp -r ./patched/* ./source/

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl git \
            clang cmake make ninja-build \
            protobuf-compiler \
            zip unzip \
            perl

      - name: Set up .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Force .NET 6 for this repo
        run: |
          set -euxo pipefail
          dotnet --list-sdks
          dotnet --version

      - name: Install Zig (musl toolchain)
        run: |
          set -euxo pipefail
          ARCH=$(uname -m)
          ZIG_VER=0.11.0
          # Download relevant zig
          # curl -L "https://ziglang.org/download/${ZIG_VER}/zig-linux-${{ matrix.architecture.name }}-${ZIG_VER}.tar.xz" | tar -xJ
          # sudo mv "zig-linux-x86_64-${ZIG_VER}" /opt/zig
          # Download zig 
          curl -L "https://ziglang.org/download/${ZIG_VER}/zig-linux-${ARCH}-${ZIG_VER}.tar.xz" -o zig.tar.xz | tar -xJ
          sudo mv "zig-linux-${ARCH}-${ZIG_VER}" /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          which zig
          zig version

      - name: Pin .NET SDK to 6.0
        run: |
          # Force .NET 6 for this repo by creating a global.json file
          cat > source/global.json <<'EOF'
          {
            "sdk": {
              "version": "6.0.428",
              "rollForward": "latestPatch"
            }
          }
          EOF
      
      - name: Mute git warnings about detached HEAD
        run: git config --global advice.detachedHead false

      - name: Build (musl x64 on runner)
        working-directory: source
        env:
          OS_TYPE: linux-musl
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
          DOTNET_MULTILEVEL_LOOKUP: "0"
          DOTNET_USE_POLLING_FILE_WATCHER: "false"
          DOTNET_ROOT: /usr/share/dotnet
          PATH: /usr/share/dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          # CMake: these are the ones it actually respects reliably
          CMAKE_C_COMPILER: "zig;cc"
          CMAKE_CXX_COMPILER: "zig;c++"
          CMAKE_C_FLAGS: "-target x86_64-linux-musl"
          CMAKE_CXX_FLAGS: "-target x86_64-linux-musl"
          CMAKE_EXE_LINKER_FLAGS: "-target x86_64-linux-musl"
          CMAKE_SHARED_LINKER_FLAGS: "-target x86_64-linux-musl"
        run: |
          set -euxo pipefail
          dotnet --version
          rm -rf src/OpenTelemetry.AutoInstrumentation.Native/build
          ./build.sh

      - name: Verify built artifact exists
        run: |
          test -f ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so

      - name: Archive tracer-home
        run: |
          tar czf tracer-home-${{ matrix.architecture.alias }}.tar.gz -C ./source/bin tracer-home

      - name: Upload tracer-home archive
        uses: actions/upload-artifact@v4
        with:
          name: tracer-home-${{ matrix.architecture.alias }}.tar.gz
          path: tracer-home-${{ matrix.architecture.alias }}.tar.gz

  e2e-test-legacy-musl:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-8
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.architecture.runner }}
    needs: build-legacy-dotnet6-with-musl
    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Download tracer-home
        uses: actions/download-artifact@v4
        with:
          name: tracer-home-${{ matrix.architecture.alias }}
          path: ./source/bin/tracer-home/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.architecture.alias }}
        uses: docker/build-push-action@v6
        with:
          context: ./patched/docker
          file: ./patched/docker/legacy.musl.dockerfile
          platforms: linux/${{ matrix.architecture.name }}
          push: false
          load: true
          tags: dev/dotnet-builder:${{ matrix.architecture.alias }}-legacy

      - name: Copy patched files to source directory
        run: cp -r ./patched/* ./source/

      - name: E2E test - .NET Core 3.1 span collection (${{ matrix.architecture.alias }})
        working-directory: ./source
        run: |
          docker run --platform=linux/${{ matrix.architecture.name }} -e OS_TYPE=linux-musl --rm \
            -v "$(pwd)":/project \
            -w /project \
            dev/dotnet-builder:${{ matrix.architecture.alias }}-legacy \
            bash ./e2e/run-core3-spans-test.sh

  vulnerability-scan:
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-8
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-8
        bundle:
          - name: glibc-dotnet9
          - name: legacy
    runs-on: ${{ matrix.architecture.runner }}
    needs: [build-with-glibc, build-legacy-dotnet6-with-musl]
    steps:
      - name: Download tracer-home archive
        uses: actions/download-artifact@v4
        with:
          name: tracer-home-${{ matrix.architecture.alias }}.tar.gz
          path: ./

      - name: Extract tracer-home
        run: |
          mkdir -p ./tracer-home
          tar xzf tracer-home-${{ matrix.architecture.alias }}.tar.gz -C ./tracer-home

      - name: Scan tracer-home for vulnerabilities
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: ./tracer-home/tracer-home
          severity-cutoff: "HIGH,CRITICAL"
