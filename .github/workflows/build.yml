name: Build

on:
  pull_request:

permissions:
  contents: read
env:
  LEGACY_TAG: v0.4.0-beta.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-with-glibc:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-32
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-32
    runs-on: ${{ matrix.architecture.runner }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Checkout source code at version specified in version.txt
        id: get_version
        run: |
          cd source
          git fetch --tags
          # Checkout latest tag; read it from the version.txt file 
          VERSION=$(cat ../version.txt)
          echo "Checking out version: $VERSION"
          git checkout $VERSION
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.architecture.alias }}
        uses: docker/build-push-action@v6
        with:
          context: ./patched/docker
          file: ./patched/docker/glibc.dockerfile
          platforms: linux/${{ matrix.architecture.name }}
          push: false
          load: true
          tags: dev/dotnet-builder:${{ matrix.architecture.alias }}

      - name: Build and test for ${{ matrix.architecture.alias }}
        run: |
          cd source
          docker run --platform=linux/${{ matrix.architecture.name }} -e OS_TYPE=linux-glibc --rm \
            -v "$(pwd)":/project \
            dev/dotnet-builder:${{ matrix.architecture.alias }} \
            ./build.sh

      - name: Verify built artifact exists
        run: |
          test -f ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so

      # Upload the .so file
      - name: Upload native .so
        uses: actions/upload-artifact@v4
        with:
          name: OpenTelemetry.AutoInstrumentation.Native-${{ steps.get_version.outputs.version }}-${{ matrix.architecture.alias }}.so
          path: ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so

      # Upload the full build output directory
      - name: Upload build output directory
        uses: actions/upload-artifact@v4
        with:
          name: glibc-dotnet9-bundle-${{ matrix.architecture.alias }}
          path: ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/

  vulnerability-scan:
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-8
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-8
        bundle:
          - name: glibc-dotnet9
          - name: legacy
    runs-on: ${{ matrix.architecture.runner }}
    needs: [build-with-glibc, build-legacy-dotnet6-with-musl]
    steps:
      - name: Download glibc-dotnet9 bundle
        if: matrix.bundle.name == 'glibc-dotnet9'
        uses: actions/download-artifact@v4
        with:
          name: glibc-dotnet9-bundle-${{ matrix.architecture.alias }}
          path: ./glibc-dotnet9-bundle

      - name: Scan glibc-dotnet9 bundle for vulnerabilities
        if: matrix.bundle.name == 'glibc-dotnet9'
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: ./glibc-dotnet9-bundle
          severity-cutoff: "HIGH,CRITICAL"

      - name: Download native library
        if: matrix.bundle.name == 'legacy'
        uses: actions/download-artifact@v4
        with:
          name: legacy-native-build-${{ matrix.architecture.alias }}
          path: ./native-library

      - name: Download legacy bundle
        if: matrix.bundle.name == 'legacy'
        uses: actions/download-artifact@v4
        with:
          name: legacy-bundle-${{ matrix.architecture.alias }}
          path: ./legacy-bundle

      - name: Scan native library for vulnerabilities
        if: matrix.bundle.name == 'legacy'
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: ./native-library
          severity-cutoff: "HIGH,CRITICAL"

      - name: Scan legacy bundle for vulnerabilities
        if: matrix.bundle.name == 'legacy'
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: ./legacy-bundle
          severity-cutoff: "HIGH,CRITICAL"

  # Need to build musl
  build-legacy-dotnet6-with-musl:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-32
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-32
    runs-on: ${{ matrix.architecture.runner }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Checkout tag ${{ env.LEGACY_TAG }}
        run: |
          cd source
          git fetch --tags
          git checkout ${{ env.LEGACY_TAG }}

      - name: Overwrite patched files
        run: cp -r ./patched/* ./source/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.architecture.alias }}
        uses: docker/build-push-action@v6
        with:
          context: ./patched/docker
          file: ./patched/docker/legacy.debian.dockerfile
          platforms: linux/${{ matrix.architecture.name }}
          push: false
          load: true
          tags: dev/dotnet-builder:${{ matrix.architecture.alias }}-legacy

      # - name: Install .NET SDK 6.0 and .NET Core 3.1 runtime
      #   run: |
      #     wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
      #     chmod +x dotnet-install.sh
      #     ./dotnet-install.sh --channel 6.0 --install-dir /usr/share/dotnet
      #     ./dotnet-install.sh --runtime dotnet --channel 3.1 --install-dir /usr/share/dotnet
      #     ./dotnet-install.sh --runtime aspnetcore --channel 3.1 --install-dir /usr/share/dotnet
      #     rm dotnet-install.sh
      #     echo "/usr/share/dotnet" >> $GITHUB_PATH
      #     echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV

      - name: Build and test for ${{ matrix.architecture.alias }}
        run: |
          cd source
          docker run --platform=linux/${{ matrix.architecture.name }} -e OS_TYPE=linux-musl --rm \
          -v "$(pwd)":/project \
          dev/dotnet-builder:${{ matrix.architecture.alias }} \
          ./build.sh

      - name: Verify built artifact exists
        run: |
          test -f ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so

      # Upload the .so file
      - name: Upload native .so
        uses: actions/upload-artifact@v4
        with:
          name: OpenTelemetry.AutoInstrumentation.Native-${{ env.LEGACY_TAG }}-${{ matrix.architecture.alias }}.so
          path: ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so

      # Upload the full build output directory
      - name: Upload build output directory
        uses: actions/upload-artifact@v4
        with:
          name: legacy-native-build-${{ matrix.architecture.alias }}
          path: ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/

      # Upload the assembled legacy-bundle (managed DLLs, startup hook, etc.)
      - name: Upload legacy-bundle
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bundle-${{ matrix.architecture.alias }}
          path: ./source/bin/tracer-home/

  e2e-test-legacy-musl:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-8
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.architecture.runner }}
    needs: build-legacy-dotnet6-with-musl
    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: legacy-native-build-${{ matrix.architecture.alias }}
          path: ./downloaded

      - name: Restore native library to source directory
        run: |
          mkdir -p ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin
          cp -r ./downloaded/* ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/

      - name: Download legacy-bundle
        uses: actions/download-artifact@v4
        with:
          name: legacy-bundle-${{ matrix.architecture.alias }}
          path: ./source/bin/tracer-home/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.architecture.alias }}
        uses: docker/build-push-action@v6
        with:
          context: ./patched/docker
          file: ./patched/docker/legacy.debian.dockerfile
          platforms: linux/${{ matrix.architecture.name }}
          push: false
          load: true
          tags: dev/dotnet-builder:${{ matrix.architecture.alias }}-legacy

      - name: Copy patched files to source directory
        run: cp -r ./patched/* ./source/

      - name: E2E test - .NET Core 3.1 span collection (${{ matrix.architecture.alias }})
        working-directory: ./source
        run: |
          docker run --platform=linux/${{ matrix.architecture.name }} -e OS_TYPE=linux-musl --rm \
            -v "$(pwd)":/project \
            dev/dotnet-builder:${{ matrix.architecture.alias }}-legacy \
            bash ./e2e/run-core3-spans-test.sh
          # OS_TYPE=linux-glibc bash ./e2e/run-core3-spans-test.sh
