name: Build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-8
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.architecture.runner }}

    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            3.1
            6

      - name: Overwrite patched files
        run: cp -r ./patched/* ./source/

      - name: Prepare for build
        run: |
          git config --global advice.detachedHead false
          sudo apt update && \
          sudo apt install -y --no-install-recommends \
              cmake \
              clang \
              make \
              build-essential \
              wget

      - name: Build and test for ${{ matrix.architecture.alias }}
        run: |
          cd source
          OS_TYPE=linux-glibc ./build.sh

      - name: Verify built artifact exists
        run: |
          test -f ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/OpenTelemetry.AutoInstrumentation.Native.so
      
      # Upload the full build output directory as an artifact
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-library-${{ matrix.architecture.alias }}
          path: ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/

      # Upload the assembled legacy-bundle (managed DLLs, startup hook, etc.)
      - name: Upload legacy-bundle
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bundle-${{ matrix.architecture.alias }}
          path: ./source/bin/tracer-home/

  vulnerability-scan:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-8
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.architecture.runner }}
    needs: build
    steps:
      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-library-${{ matrix.architecture.alias }}
          path: ./native-library

      - name: Download legacy-bundle
        uses: actions/download-artifact@v4
        with:
          name: legacy-bundle-${{ matrix.architecture.alias }}
          path: ./legacy-bundle

      - name: Scan native library for vulnerabilities
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: ./native-library
          severity-cutoff: "HIGH,CRITICAL"

      - name: Scan legacy-bundle for vulnerabilities
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: ./legacy-bundle
          severity-cutoff: "HIGH,CRITICAL"

  test-e2e:
    strategy:
      matrix:
        architecture:
          - name: amd64
            alias: x64
            runner: depot-ubuntu-24.04-8
          - name: arm64
            alias: arm64
            runner: depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.architecture.runner }}
    needs: build
    steps:
      - name: Check out this repository
        uses: actions/checkout@v3
        with:
            submodules: recursive

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-library-${{ matrix.architecture.alias }}
          path: ./downloaded

      - name: Restore native library to source directory
        run: |
          mkdir -p ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin
          cp -r ./downloaded/* ./source/src/OpenTelemetry.AutoInstrumentation.Native/build/bin/

      - name: Download legacy-bundle
        uses: actions/download-artifact@v4
        with:
          name: legacy-bundle-${{ matrix.architecture.alias }}
          path: ./source/bin/tracer-home/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy patched files to source directory
        run: cp -r ./patched/* ./source/

      - name: build the docker image for ${{ matrix.architecture.alias }}
        working-directory: ./source/docker
        run: |
          docker buildx build --platform=linux/${{ matrix.architecture.name }} -t test-e2e . -f debian.dockerfile --load

      - name: E2E test - .NET Core 3.1 span collection (${{ matrix.architecture.alias }})
        working-directory: ./source
        run: |
          docker run --platform=linux/${{ matrix.architecture.name }} --rm \
            -v "$(pwd)":/project \
            -e OS_TYPE=linux-glibc \
            test-e2e \
            bash /project/e2e/run-core3-spans-test.sh
